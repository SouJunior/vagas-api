# SonarCloud Configuration for Vagas API
sonar.projectKey=SouJunior_vagas-api
sonar.organization=soujunior

# Project Information
sonar.projectName=Vagas API
sonar.projectVersion=1.0

# Source Code Settings
sonar.sources=src
sonar.tests=test
sonar.sourceEncoding=UTF-8

# Language Settings
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.spec.ts,**/*.test.ts,**/test/**,**/node_modules/**,**/dist/**

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.ts,**/*.test.ts

# Test Exclusions
sonar.test.exclusions=**/node_modules/**,**/dist/**,**/coverage/**

# Duplication Exclusions
sonar.cpd.exclusions=**/*.spec.ts,**/*.test.ts